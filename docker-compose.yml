version: '3.8'

services:
  # ---------------------------------------------------------------------------
  # 0. Jenkins CI/CD Server (Viva Demo - http://localhost:8090)
  # ---------------------------------------------------------------------------
  jenkins:
    image: jenkins/jenkins:lts-jdk21
    container_name: telecom-jenkins
    restart: always
    privileged: true
    user: root
    ports:
      - "8090:8080"
      - "50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - .:/workspace/broadband-workflow:ro
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
    networks:
      - telecom-network

  # ---------------------------------------------------------------------------
  # 1. MySQL Database Service
  # ---------------------------------------------------------------------------
  mysql-db:
    image: mysql:8.0
    container_name: telecom-mysql-db
    restart: always
    environment:
      MYSQL_DATABASE: ${DB_NAME:-broadband_db}
      MYSQL_USER: ${DB_USER:-telecom_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-telecom_secret}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_telecom_pass}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - telecom-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_telecom_pass}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # 2. Spring Boot Backend API Service
  # ---------------------------------------------------------------------------
  backend-api:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    image: ${REGISTRY_USER:-pushkarwaykole}/broadband-backend:${IMAGE_TAG:-1.0.0}
    container_name: telecom-backend-api
    restart: always
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-broadband_db}
      DB_USER: ${DB_USER:-telecom_user}
      DB_PASSWORD: ${DB_PASSWORD:-telecom_secret}
      PORT: 8080
      UPLOAD_DIR: /app/uploads
    ports:
      - "${BACKEND_PORT:-8082}:8080"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - telecom-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 40s

  # ---------------------------------------------------------------------------
  # 3. Frontend Web Service & Reverse Proxy (Nginx + React)
  # ---------------------------------------------------------------------------
  frontend-web:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    image: ${REGISTRY_USER:-pushkarwaykole}/broadband-frontend:${IMAGE_TAG:-1.0.0}
    container_name: telecom-frontend-web
    restart: always
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      backend-api:
        condition: service_healthy
    networks:
      - telecom-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 15s
      timeout: 5s
      retries: 3

volumes:
  mysql_data:
    driver: local
  uploads_data:
    driver: local
  jenkins_home:
    driver: local

networks:
  telecom-network:
    driver: bridge

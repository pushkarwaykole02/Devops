# =========================================================================
# Ansible Inventory - Broadband Installation Workflow
# =========================================================================

[telecom_servers]
# Local testing target (or VM target)
localhost ansible_connection=local

# Example production server (uncomment and replace with real IP for remote deployment):
# prod-telecom-01 ansible_host=192.168.1.50 ansible_user=deployer ansible_ssh_private_key_file=~/.ssh/id_rsa

[telecom_servers:vars]
app_deploy_dir=/opt/broadband-workflow
app_user=telecom
app_group=telecom
app_version=1.0.0
docker_compose_version=v2.24.5
db_name=broadband_db
db_user=telecom_user
db_password=telecom_secure_password_2026
db_root_password=telecom_root_password_2026
